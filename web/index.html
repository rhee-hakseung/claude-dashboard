<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 28 28" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#7c6cff"/><stop offset="1" stop-color="#4a3fe0"/></linearGradient></defs>
      <rect width="28" height="28" rx="8" fill="url(#lg)"/>
      <rect x="7" y="8" width="14" height="2.6" rx="1.3" fill="#fff"/>
      <rect x="7" y="12.7" width="9.5" height="2.6" rx="1.3" fill="#fff" opacity=".8"/>
      <rect x="7" y="17.4" width="12" height="2.6" rx="1.3" fill="#fff" opacity=".6"/>
    </svg>
    <div class="brand-text"><b>Claude dashboard</b><span id="root-path"></span></div>
  </div>
  <label class="search" id="search">
    <span class="search-icon" data-icon="search"></span>
    <input id="q" type="text" placeholder="세션 · 프로젝트 검색" spellcheck="false" autocomplete="off">
    <kbd id="q-hint">Ctrl K</kbd>
    <button id="q-clear" class="icon-btn" title="검색 지우기" data-icon="x" hidden></button>
  </label>
  <button id="theme" class="icon-btn lg" title="밝게 / 어둡게"></button>
</header>

<main>
  <section id="summary" class="summary" aria-label="요약"></section>
  <section id="favs" class="favs" aria-label="즐겨찾기"></section>
  <div id="grid-head"></div>
  <section id="grid" class="grid" aria-label="프로젝트"></section>
  <p id="empty" class="blank" hidden></p>
</main>

<footer id="status" class="status"></footer>
<div id="toast" class="toast" role="status"></div>
<div id="fav-drop" class="fav-drop"><span data-icon="star"></span>여기에 놓으면 즐겨찾기에 추가됩니다</div>

<script src="icons.js"></script>
<script src="render.js"></script>
<script src="app.js"></script>
</body>
</html>
